[project]
name = "stardb"
version = "0.1.0"
description = "Debugging utilities for C++ and Python using LLDB and iPython"
readme = "README.md"
requires-python = ">=3.14.8"
dependencies = [
    "ipython>=9.0",
]

[project.optional-dependencies]
dev = ["ipdb", "mypy", "ruff"]
test = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["ipsh.py", "tree_utils.py"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
ignore_missing_imports = true

[tool.pytest.ini_options]
python_files = ["*_test.py"]
